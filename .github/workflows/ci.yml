name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DemoStudio.Desktop.sln -nologo

      - name: Build Desktop Solution
        run: dotnet build DemoStudio.Desktop.sln -c Release --no-restore -nologo -v minimal

      - name: Test Core
        run: dotnet test tests/DemoStudio.Desktop.Core.Tests/DemoStudio.Desktop.Core.Tests.csproj -c Release --no-build -nologo -v minimal -m:1

      - name: Test App
        run: dotnet test tests/DemoStudio.Desktop.App.Tests/DemoStudio.Desktop.App.Tests.csproj -c Release --no-build -nologo -v minimal -m:1

      - name: Release Confidence Gate Tests
        run: dotnet test tests/DemoStudio.Desktop.App.Tests/DemoStudio.Desktop.App.Tests.csproj -c Release --no-build -nologo -v minimal -m:1 --filter "Gate=ReleaseConfidence"

      - name: Architecture Docs Sync Check
        shell: pwsh
        run: ./scripts/check-architecture-docs.ps1
